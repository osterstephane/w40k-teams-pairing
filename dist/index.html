<script type="module">
// ---- src/rules.js
// Rules data from the Games Workshop "Warhammer 40,000 Teams Event Companion"
// (version 1.0, file eng_22-07_warhammer_40,000_teams_event_companion).
// Kept as plain data so the solver never hard-codes team-size specifics.

// Section 2 "Pairing System": modules used per team size.
//   S = Initial Skirmish, M = Main Engagement, C = Champion System.
const MODULES_BY_SIZE = {
  3: ['M'],
  4: ['M', 'C'],
  5: ['S', 'M'],
  6: ['S', 'M', 'C'],
  7: ['S', 'S', 'M'],
  8: ['S', 'S', 'M', 'C'],
};

// Section 14 "Team Scoring": a team must exceed its opponent by at least Y BP to win.
const WIN_DIFFERENTIAL = { 3: 4, 4: 6, 5: 6, 6: 8, 7: 10, 8: 12 };

// Section 14: VP difference -> Battle Points (player, opponent). Sum is always 20.
const BP_TABLE = [
  [5, 10], [10, 11], [15, 12], [20, 13], [25, 14], [30, 15],
  [35, 16], [40, 17], [45, 18], [50, 19],
];

function vpDiffToBp(diff) {
  const d = Math.abs(diff);
  let bp = 20;
  for (const [max, v] of BP_TABLE) if (d <= max) { bp = v; break; }
  return diff >= 0 ? bp : 20 - bp;
}

// Team Points: win 3, draw 2, loss 1.
const TEAM_POINTS = { win: 3, draw: 2, loss: 1 };

const LAYOUTS = ['A', 'B', 'C'];

// Refused attackers (Main Engagement step 8) and Champions use the layout
// given by the round: round 1 -> A, round 2 -> B, round 3 -> C, repeating.
function layoutForRound(round) {
  return (((round - 1) % 3) + 3) % 3;
}

// Team BP thresholds on "our" total (both totals sum to 20 * n).
//   win  : ours - theirs >= Y  <=> ours >= 10n + Y/2
//   loss : theirs - ours >= Y  <=> ours <= 10n - Y/2
function thresholds(n) {
  const y = WIN_DIFFERENTIAL[n];
  return { win: 10 * n + y / 2, loss: 10 * n - y / 2, total: 20 * n, differential: y };
}

// ---- src/matrixgame.js
// Zero-sum matrix game solver.
// The row player maximises, the column player minimises the row payoff.
// Returns { x: row mixed strategy, y: column mixed strategy, v: game value }.

const EPS = 1e-12;

function solve2x2(a, b, c, d) {
  // [[a, b], [c, d]]
  // Pure saddle point check.
  const r0 = Math.min(a, b), r1 = Math.min(c, d);
  const c0 = Math.max(a, c), c1 = Math.max(b, d);
  const maximin = Math.max(r0, r1);
  const minimax = Math.min(c0, c1);
  if (maximin >= minimax - EPS) {
    const i = r0 >= r1 ? 0 : 1;
    const j = c0 <= c1 ? 0 : 1;
    return { x: i === 0 ? [1, 0] : [0, 1], y: j === 0 ? [1, 0] : [0, 1], v: maximin };
  }
  const den = a - b - c + d;
  const p = (d - c) / den; // prob of row 0
  const q = (d - b) / den; // prob of column 0
  return { x: [p, 1 - p], y: [q, 1 - q], v: (a * d - b * c) / den };
}

// A: array of rows (m x n).
function solveMatrixGame(A) {
  const m = A.length, n = A[0].length;
  if (m === 1 || n === 1) return solveDegenerate(A);
  if (m === 2 && n === 2) return solve2x2(A[0][0], A[0][1], A[1][0], A[1][1]);

  // Pure saddle point shortcut (very common in practice).
  let maximin = -Infinity, bi = 0;
  for (let i = 0; i < m; i++) {
    let mn = Infinity;
    for (let j = 0; j < n; j++) if (A[i][j] < mn) mn = A[i][j];
    if (mn > maximin) { maximin = mn; bi = i; }
  }
  let minimax = Infinity, bj = 0;
  for (let j = 0; j < n; j++) {
    let mx = -Infinity;
    for (let i = 0; i < m; i++) if (A[i][j] > mx) mx = A[i][j];
    if (mx < minimax) { minimax = mx; bj = j; }
  }
  if (maximin >= minimax - EPS) {
    const x = new Array(m).fill(0); x[bi] = 1;
    const y = new Array(n).fill(0); y[bj] = 1;
    return { x, y, v: maximin };
  }
  return simplex(A, m, n);
}

function solveDegenerate(A) {
  const m = A.length, n = A[0].length;
  if (m === 1) {
    let j0 = 0;
    for (let j = 1; j < n; j++) if (A[0][j] < A[0][j0]) j0 = j;
    const y = new Array(n).fill(0); y[j0] = 1;
    return { x: [1], y, v: A[0][j0] };
  }
  let i0 = 0;
  for (let i = 1; i < m; i++) if (A[i][0] > A[i0][0]) i0 = i;
  const x = new Array(m).fill(0); x[i0] = 1;
  return { x, y: [1], v: A[i0][0] };
}

// Column player's LP on a strictly positive shifted matrix:
//   maximise sum(y) s.t. A' y <= 1, y >= 0.  value = 1 / sum(y).
// Row strategy is read from the dual (objective-row coefficients of slacks).
function simplex(A, m, n) {
  let min = Infinity;
  for (let i = 0; i < m; i++) for (let j = 0; j < n; j++) if (A[i][j] < min) min = A[i][j];
  const shift = 1 - min;
  const W = n + m + 1; // columns: y (n), slacks (m), rhs
  const T = new Float64Array((m + 1) * W);
  for (let i = 0; i < m; i++) {
    const r = i * W;
    for (let j = 0; j < n; j++) T[r + j] = A[i][j] + shift;
    T[r + n + i] = 1;
    T[r + W - 1] = 1;
  }
  const obj = m * W;
  for (let j = 0; j < n; j++) T[obj + j] = -1;
  const basis = new Int32Array(m);
  for (let i = 0; i < m; i++) basis[i] = n + i;

  for (let iter = 0; iter < 10000; iter++) {
    // Bland's rule: first improving column.
    let pc = -1;
    for (let j = 0; j < n + m; j++) if (T[obj + j] < -1e-12) { pc = j; break; }
    if (pc < 0) break;
    let pr = -1, best = Infinity;
    for (let i = 0; i < m; i++) {
      const a = T[i * W + pc];
      if (a > 1e-12) {
        const ratio = T[i * W + W - 1] / a;
        if (ratio < best - 1e-12 || (Math.abs(ratio - best) <= 1e-12 && basis[i] < basis[pr])) {
          best = ratio; pr = i;
        }
      }
    }
    if (pr < 0) break; // unbounded: cannot happen with positive matrix
    const pv = T[pr * W + pc];
    for (let k = 0; k < W; k++) T[pr * W + k] /= pv;
    for (let i = 0; i <= m; i++) {
      if (i === pr) continue;
      const f = T[i * W + pc];
      if (f !== 0) for (let k = 0; k < W; k++) T[i * W + k] -= f * T[pr * W + k];
    }
    basis[pr] = pc;
  }
  const sumY = T[obj + W - 1];
  const vShift = 1 / sumY;
  const y = new Array(n).fill(0);
  for (let i = 0; i < m; i++) if (basis[i] < n) y[basis[i]] = T[i * W + W - 1] * vShift;
  const x = new Array(m);
  for (let i = 0; i < m; i++) x[i] = Math.max(0, T[obj + n + i]) * vShift;
  return { x: normalise(x), y: normalise(y), v: vShift - shift };
}

function normalise(p) {
  let s = 0;
  for (const v of p) s += v;
  return s > 0 ? p.map((v) => v / s) : p;
}

// ---- src/engine.js
// Pairing decision engine.
//
// Model
// -----
// mu[l][a][b] : expected Battle Points (0-20) for OUR player a against THEIR
//               player b on layout l (0 = A, 1 = B, 2 = C).
// sd[l][a][b] : standard deviation of that BP result (uncertainty of the estimate
//               plus dice). Games are assumed independent, so the team total is
//               approximated by a normal distribution N(sum mu, sum sd^2).
//
// The pairing is a sequence of simultaneous secret choices (defender, attackers,
// which attacker to accept). Every such step is solved as a zero-sum matrix game,
// with backward induction over the whole pairing tree.
//
// Objective (maximised by us, minimised by the opponent):
//   obj = (1 - marginWeight) * (P(win) + drawValue * P(draw))
//       +      marginWeight  * (E[our BP] / total BP)
// drawValue = 0.5, marginWeight = 0  <=>  maximise expected Team Points.
//
// Two layers:
//  - "obj" layer: objective value only, memoised, used to find the equilibria;
//  - "metrics" layer: follows the equilibria found by the obj layer and returns
//    [obj, P(win), P(draw), P(loss), E[our BP]].
//
// Documented simplifications (see docs/MODEL.md):
//  - in the look-ahead, a defender picks the layout with the best expected BP for
//    its side (the live state always uses the layout actually declared);
//  - the accumulated mean / variance are snapped to a small grid at the start of
//    each non-final module so sub-trees can be shared (default 0.5 BP, 4 BP^2).



const METRIC = { OBJ: 0, WIN: 1, DRAW: 2, LOSS: 3, BP: 4 };

function bits(mask) {
  const out = [];
  for (let i = 0; mask; i++, mask >>= 1) if (mask & 1) out.push(i);
  return out;
}

function pairs(list) {
  const out = [];
  for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) out.push([list[i], list[j]]);
  return out;
}

// Standard normal CDF (Abramowitz & Stegun 7.1.26, |err| < 1.5e-7).
function phi(z) {
  const t = 1 / (1 + 0.3275911 * Math.abs(z) / Math.SQRT2);
  const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-z * z / 2);
  return z >= 0 ? 0.5 * (1 + y) : 0.5 * (1 - y);
}

function value2x2(a, b, c, d) {
  const maximin = Math.max(Math.min(a, b), Math.min(c, d));
  const minimax = Math.min(Math.max(a, c), Math.max(b, d));
  if (maximin >= minimax - 1e-12) return maximin;
  return (a * d - b * c) / (a - b - c + d);
}

function lowBit(mask) {
  return 31 - Math.clz32(mask & -mask);
}

function createEngine(config) {
  const n = config.n;
  const modules = MODULES_BY_SIZE[n];
  if (!modules) throw new Error(`Unsupported team size ${n} (3 to 8)`);
  const th = thresholds(n);
  const round = config.round ?? 1;
  const fixedLayout = layoutForRound(round);
  const drawValue = config.objective?.drawValue ?? 0.5;
  const marginWeight = config.objective?.marginWeight ?? 0;
  const qm = config.quantum?.mean ?? 0.5;
  const qv = config.quantum?.variance ?? 4;
  const mu = config.mu, sd = config.sd;

  // Per role: layout used, mean and variance of the game (look-ahead model).
  const ourDefLayout = new Int8Array(n * n), theirDefLayout = new Int8Array(n * n);
  const OM = new Float64Array(n * n), OV = new Float64Array(n * n); // our defender game
  const TM = new Float64Array(n * n), TV = new Float64Array(n * n); // their defender game
  const FM = new Float64Array(n * n), FV = new Float64Array(n * n); // fixed-layout game
  for (let a = 0; a < n; a++) {
    for (let b = 0; b < n; b++) {
      const k = a * n + b;
      let best = 0, worst = 0;
      for (let l = 1; l < 3; l++) {
        if (mu[l][a][b] > mu[best][a][b]) best = l;
        if (mu[l][a][b] < mu[worst][a][b]) worst = l;
      }
      ourDefLayout[k] = best; theirDefLayout[k] = worst;
      OM[k] = mu[best][a][b]; OV[k] = sd[best][a][b] ** 2;
      TM[k] = mu[worst][a][b]; TV[k] = sd[worst][a][b] ** 2;
      FM[k] = mu[fixedLayout][a][b]; FV[k] = sd[fixedLayout][a][b] ** 2;
    }
  }

  const winZ = th.win - 0.5, lossZ = th.loss + 0.5;

  function terminal(M, V) {
    const s = Math.sqrt(Math.max(V, 1e-4));
    const pW = 1 - phi((winZ - M) / s);
    const pL = phi((lossZ - M) / s);
    const pD = Math.max(0, 1 - pW - pL);
    const obj = (1 - marginWeight) * (pW + drawValue * pD) + marginWeight * (M / th.total);
    return [obj, pW, pD, pL, M];
  }

  function terminalObj(M, V) {
    const s = Math.sqrt(Math.max(V, 1e-4));
    const pW = 1 - phi((winZ - M) / s);
    const pL = phi((lossZ - M) / s);
    return (1 - marginWeight) * (pW + drawValue * Math.max(0, 1 - pW - pL)) + marginWeight * (M / th.total);
  }

  const snapM = (M) => Math.round(M / qm) * qm;
  const snapV = (V) => Math.round(V / qv) * qv;
  // Numeric memo keys while they stay exact (always true with the default grid);
  // string keys otherwise (e.g. very fine grids used in tests).
  const mRange = Math.ceil(2 * 20 * n / qm) + 2, vRange = Math.ceil(n * 400 / qv) + 2;
  const numericKeys = mRange * vRange * 8 * 65536 < Number.MAX_SAFE_INTEGER;
  const keyOf = numericKeys
    ? (remA, remB, mod, M, V) => (((Math.round(V / qv) * mRange + Math.round(M / qm)) * 8 + mod) * 256 + remB) * 256 + remA
    : (remA, remB, mod, M, V) => `${remA},${remB},${mod},${Math.round(M / qm)},${Math.round(V / qv)}`;

  const objMemo = new Map();
  const metMemo = new Map();

  // Next state after the step-5 choices (k: which of their attackers our defender
  // plays, l: which of our attackers their defender plays).
  function transition(remA, remB, mod, M, V, dA, dB, pa, pb, k, l) {
    const g1 = dA * n + pb[k], g2 = pa[l] * n + dB;
    M += OM[g1] + TM[g2];
    V += OV[g1] + TV[g2];
    let nA, nB;
    if (modules[mod] === 'M') {
      const g3 = pa[1 - l] * n + pb[1 - k];
      M += FM[g3]; V += FV[g3];
      nA = remA & ~(1 << dA) & ~(1 << pa[0]) & ~(1 << pa[1]);
      nB = remB & ~(1 << dB) & ~(1 << pb[0]) & ~(1 << pb[1]);
    } else {
      nA = remA & ~(1 << dA) & ~(1 << pa[l]);
      nB = remB & ~(1 << dB) & ~(1 << pb[k]);
    }
    mod++;
    // Champion System: forced pairing of the last player of each team.
    while (mod < modules.length && modules[mod] === 'C') {
      const c = lowBit(nA) * n + lowBit(nB);
      M += FM[c]; V += FV[c];
      nA = 0; nB = 0; mod++;
    }
    return { remA: nA, remB: nB, mod, M, V, terminal: mod >= modules.length };
  }

  // ---------------------------------------------------------------- obj layer

  function objModule(remA, remB, mod, M, V) {
    while (mod < modules.length && modules[mod] === 'C') {
      const c = lowBit(remA) * n + lowBit(remB);
      M += FM[c]; V += FV[c]; remA = 0; remB = 0; mod++;
    }
    if (mod >= modules.length) return terminalObj(M, V);
    M = snapM(M); V = snapV(V);
    const key = keyOf(remA, remB, mod, M, V);
    let v = objMemo.get(key);
    if (v !== undefined) return v;
    v = modules[mod] === 'M' ? finalModuleObj(remA, remB, M, V) : objDefenderStage(remA, remB, mod, M, V).eq.v;
    objMemo.set(key, v);
    return v;
  }

  function objOutcome(remA, remB, mod, M, V, dA, dB, pa, pb, k, l) {
    const t = transition(remA, remB, mod, M, V, dA, dB, pa, pb, k, l);
    return t.terminal ? terminalObj(t.M, t.V) : objModule(t.remA, t.remB, t.mod, t.M, t.V);
  }

  function objChooseStage(remA, remB, mod, M, V, dA, dB, pa, pb) {
    const A = [
      [objOutcome(remA, remB, mod, M, V, dA, dB, pa, pb, 0, 0), objOutcome(remA, remB, mod, M, V, dA, dB, pa, pb, 0, 1)],
      [objOutcome(remA, remB, mod, M, V, dA, dB, pa, pb, 1, 0), objOutcome(remA, remB, mod, M, V, dA, dB, pa, pb, 1, 1)],
    ];
    return { A, eq: solve2x2(A[0][0], A[0][1], A[1][0], A[1][1]) };
  }

  function objAttackerStage(remA, remB, mod, M, V, dA, dB) {
    const rows = pairs(bits(remA & ~(1 << dA)));
    const cols = pairs(bits(remB & ~(1 << dB)));
    const A = rows.map((pa) => cols.map((pb) => objChooseStage(remA, remB, mod, M, V, dA, dB, pa, pb).eq.v));
    return { rows, cols, A, eq: solveMatrixGame(A) };
  }

  function objDefenderStage(remA, remB, mod, M, V) {
    const rows = bits(remA), cols = bits(remB);
    const A = rows.map((dA) => cols.map((dB) => objAttackerStage(remA, remB, mod, M, V, dA, dB).eq.v));
    return { rows, cols, A, eq: solveMatrixGame(A) };
  }

  // Fast path for the Main Engagement (always the last choice module): no
  // allocation per leaf, no memo for terminal states. Same maths as the
  // generic stages above.
  function finalModuleObj(remA, remB, M, V) {
    const LA = bits(remA), LB = bits(remB), r = LA.length;
    const champ = r === 4;
    const D = [];
    for (let iA = 0; iA < r; iA++) {
      const dA = LA[iA];
      const oA = LA.filter((x) => x !== dA);
      const PA = pairs(oA);
      const row = [];
      for (let iB = 0; iB < r; iB++) {
        const dB = LB[iB];
        const oB = LB.filter((x) => x !== dB);
        const PB = pairs(oB);
        const att = [];
        for (const pa of PA) {
          const cA = champ ? oA.find((x) => x !== pa[0] && x !== pa[1]) : -1;
          const arow = [];
          for (const pb of PB) {
            let m0 = M, v0 = V;
            if (champ) {
              const cB = oB.find((x) => x !== pb[0] && x !== pb[1]);
              m0 += FM[cA * n + cB]; v0 += FV[cA * n + cB];
            }
            const g1a = dA * n + pb[0], g1b = dA * n + pb[1];
            const g2a = pa[0] * n + dB, g2b = pa[1] * n + dB;
            // k = 0/1: our defender plays pb[k]; l = 0/1: their defender plays pa[l].
            const o00 = terminalObj(m0 + OM[g1a] + TM[g2a] + FM[pa[1] * n + pb[1]], v0 + OV[g1a] + TV[g2a] + FV[pa[1] * n + pb[1]]);
            const o01 = terminalObj(m0 + OM[g1a] + TM[g2b] + FM[pa[0] * n + pb[1]], v0 + OV[g1a] + TV[g2b] + FV[pa[0] * n + pb[1]]);
            const o10 = terminalObj(m0 + OM[g1b] + TM[g2a] + FM[pa[1] * n + pb[0]], v0 + OV[g1b] + TV[g2a] + FV[pa[1] * n + pb[0]]);
            const o11 = terminalObj(m0 + OM[g1b] + TM[g2b] + FM[pa[0] * n + pb[0]], v0 + OV[g1b] + TV[g2b] + FV[pa[0] * n + pb[0]]);
            arow.push(value2x2(o00, o01, o10, o11));
          }
          att.push(arow);
        }
        row.push(solveMatrixGame(att).v);
      }
      D.push(row);
    }
    return solveMatrixGame(D).v;
  }

  // ------------------------------------------------------------ metrics layer

  function mix(eq, cellFn) {
    const out = [0, 0, 0, 0, 0];
    for (let i = 0; i < eq.x.length; i++) {
      if (eq.x[i] < 1e-9) continue;
      for (let j = 0; j < eq.y.length; j++) {
        const w = eq.x[i] * eq.y[j];
        if (w < 1e-9) continue;
        const c = cellFn(i, j);
        for (let t = 0; t < 5; t++) out[t] += w * c[t];
      }
    }
    return out;
  }

  function metModule(remA, remB, mod, M, V) {
    while (mod < modules.length && modules[mod] === 'C') {
      const c = lowBit(remA) * n + lowBit(remB);
      M += FM[c]; V += FV[c]; remA = 0; remB = 0; mod++;
    }
    if (mod >= modules.length) return terminal(M, V);
    M = snapM(M); V = snapV(V);
    const key = keyOf(remA, remB, mod, M, V);
    let v = metMemo.get(key);
    if (v) return v;
    const st = objDefenderStage(remA, remB, mod, M, V);
    v = mix(st.eq, (i, j) => metAttacker(remA, remB, mod, M, V, st.rows[i], st.cols[j]));
    v[0] = st.eq.v;
    metMemo.set(key, v);
    return v;
  }

  function metAttacker(remA, remB, mod, M, V, dA, dB) {
    const st = objAttackerStage(remA, remB, mod, M, V, dA, dB);
    const v = mix(st.eq, (i, j) => metChoose(remA, remB, mod, M, V, dA, dB, st.rows[i], st.cols[j]));
    v[0] = st.eq.v;
    return v;
  }

  function metChoose(remA, remB, mod, M, V, dA, dB, pa, pb) {
    const st = objChooseStage(remA, remB, mod, M, V, dA, dB, pa, pb);
    const v = mix(st.eq, (k, l) => metOutcome(remA, remB, mod, M, V, dA, dB, pa, pb, k, l));
    v[0] = st.eq.v;
    return v;
  }

  function metOutcome(remA, remB, mod, M, V, dA, dB, pa, pb, k, l) {
    const t = transition(remA, remB, mod, M, V, dA, dB, pa, pb, k, l);
    return t.terminal ? terminal(t.M, t.V) : metModule(t.remA, t.remB, t.mod, t.M, t.V);
  }

  return {
    n, modules, thresholds: th, fixedLayout, round,
    ourDefLayout: (a, b) => ourDefLayout[a * n + b],
    theirDefLayout: (a, b) => theirDefLayout[a * n + b],
    terminal,
    transition,
    snap: (M, V) => ({ M: snapM(M), V: snapV(V) }),
    // Objective only (fast).
    objModule, objDefenderStage, objAttackerStage, objChooseStage, objOutcome,
    // Full metrics following the equilibrium.
    metModule, metAttacker, metChoose, metOutcome,
    stats: () => ({ objStates: objMemo.size, metStates: metMemo.size }),
  };
}

// ---- src/pairing.js
// Live pairing state machine (Teams Event Companion, section 2 "Pairing System").
// Pure functions: every transition returns a new state.
//
// Steps inside Initial Skirmish (S) / Main Engagement (M):
//   'defenders' -> 'attackers' -> 'choices' -> 'layouts'
// Champion System (C) is resolved automatically.



function initialState(n, round = 1) {
  const modules = MODULES_BY_SIZE[n];
  if (!modules) throw new Error(`Unsupported team size ${n}`);
  const full = (1 << n) - 1;
  return resolveForced({ n, round, modules, mod: 0, remA: full, remB: full, games: [], step: 'defenders' });
}

// Resolves Champion modules and end of pairing.
function resolveForced(s) {
  s = { ...s };
  while (s.mod < s.modules.length && s.modules[s.mod] === 'C') {
    const a = bits(s.remA)[0], b = bits(s.remB)[0];
    s.games = [...s.games, { a, b, layout: layoutForRound(s.round), role: 'champion', module: s.mod }];
    s.remA = 0; s.remB = 0; s.mod++;
  }
  if (s.mod >= s.modules.length) s.step = 'done';
  return s;
}

function has(mask, i) {
  return (mask >> i) & 1;
}

function setDefenders(s, dA, dB) {
  if (s.step !== 'defenders') throw new Error('Not at defender step');
  if (!has(s.remA, dA) || !has(s.remB, dB)) throw new Error('Defender not available');
  return { ...s, dA, dB, step: 'attackers' };
}

// pa: our two attackers (against their defender), pb: their two attackers.
function setAttackers(s, pa, pb) {
  if (s.step !== 'attackers') throw new Error('Not at attacker step');
  const okA = pa.length === 2 && pa[0] !== pa[1] && pa.every((x) => x !== s.dA && has(s.remA, x));
  const okB = pb.length === 2 && pb[0] !== pb[1] && pb.every((x) => x !== s.dB && has(s.remB, x));
  if (!okA || !okB) throw new Error('Invalid attackers');
  return { ...s, pa: [...pa].sort((x, y) => x - y), pb: [...pb].sort((x, y) => x - y), step: 'choices' };
}

// k: index in pb of the attacker OUR defender accepts.
// l: index in pa of the attacker THEIR defender accepts.
function setChoices(s, k, l) {
  if (s.step !== 'choices') throw new Error('Not at choice step');
  if (![0, 1].includes(k) || ![0, 1].includes(l)) throw new Error('Invalid choice');
  return { ...s, k, l, step: 'layouts' };
}

// Layout declared by each defender for its own game (0 = A, 1 = B, 2 = C).
function setLayouts(s, ourLayout, theirLayout) {
  if (s.step !== 'layouts') throw new Error('Not at layout step');
  const { dA, dB, pa, pb, k, l } = s;
  const type = s.modules[s.mod];
  const games = [
    ...s.games,
    { a: dA, b: pb[k], layout: ourLayout, role: 'ourDefender', module: s.mod },
    { a: pa[l], b: dB, layout: theirLayout, role: 'theirDefender', module: s.mod },
  ];
  let remA, remB;
  if (type === 'M') {
    games.push({ a: pa[1 - l], b: pb[1 - k], layout: layoutForRound(s.round), role: 'refused', module: s.mod });
    remA = s.remA & ~(1 << dA) & ~(1 << pa[0]) & ~(1 << pa[1]);
    remB = s.remB & ~(1 << dB) & ~(1 << pb[0]) & ~(1 << pb[1]);
  } else {
    remA = s.remA & ~(1 << dA) & ~(1 << pa[l]);
    remB = s.remB & ~(1 << dB) & ~(1 << pb[k]);
  }
  const next = { n: s.n, round: s.round, modules: s.modules, mod: s.mod + 1, remA, remB, games, step: 'defenders' };
  return resolveForced(next);
}

// Accumulated mean / variance of our BP from the games already fixed.
function accumulated(s, mu, sd) {
  let M = 0, V = 0;
  for (const g of s.games) {
    M += mu[g.layout][g.a][g.b];
    V += sd[g.layout][g.a][g.b] ** 2;
  }
  return { M, V };
}

// ---- src/advisor.js
// Turns engine results into decision support for the current pairing step.



function metricsOf(v) {
  const [obj, win, draw, loss, bp] = v;
  return { obj, win, draw, loss, bp, tp: 3 * win + 2 * draw + loss };
}

function weighted(list) {
  const out = [0, 0, 0, 0, 0];
  for (const [w, v] of list) for (let t = 0; t < 5; t++) out[t] += w * v[t];
  return out;
}

// Generic analysis of a simultaneous step given its objective matrix A and a
// function returning full metrics for a cell.
function analyse(A, rowLabels, colLabels, cellMetrics) {
  const eq = solveMatrixGame(A);
  const m = A.length, nc = A[0].length;
  const cache = new Map();
  const cell = (i, j) => {
    const k = i * nc + j;
    if (!cache.has(k)) cache.set(k, cellMetrics(i, j));
    return cache.get(k);
  };
  const rows = [];
  for (let i = 0; i < m; i++) {
    let vsEq = 0, worst = Infinity, best = -Infinity, worstCol = 0;
    for (let j = 0; j < nc; j++) {
      vsEq += eq.y[j] * A[i][j];
      if (A[i][j] < worst) { worst = A[i][j]; worstCol = j; }
      if (A[i][j] > best) best = A[i][j];
    }
    const met = weighted(eq.y.map((y, j) => [y, y > 1e-9 ? cell(i, j) : [0, 0, 0, 0, 0]]));
    met[0] = vsEq;
    rows.push({ index: i, label: rowLabels[i], prob: eq.x[i], vsEq, worst, best, worstCol, metrics: metricsOf(met) });
  }
  const cols = [];
  for (let j = 0; j < nc; j++) {
    let vsEq = 0, best = -Infinity, bestRow = 0;
    for (let i = 0; i < m; i++) {
      vsEq += eq.x[i] * A[i][j];
      if (A[i][j] > best) { best = A[i][j]; bestRow = i; }
    }
    cols.push({ index: j, label: colLabels[j], prob: eq.y[j], vsEq, bestResponse: bestRow, bestResponseValue: best });
  }
  const projection = weighted(rows.map((r) => [r.prob, [r.metrics.obj, r.metrics.win, r.metrics.draw, r.metrics.loss, r.metrics.bp]]));
  projection[0] = eq.v;
  return { A, eq, value: eq.v, rows, cols, projection: metricsOf(projection) };
}

function advise(engine, state, mu, sd, onProgress) {
  const acc = accumulated(state, mu, sd);
  if (state.step === 'done') {
    return { step: 'done', projection: metricsOf(engine.terminal(acc.M, acc.V)), accumulated: acc };
  }
  const { M, V } = engine.snap(acc.M, acc.V);
  const { remA, remB, mod } = state;

  if (state.step === 'defenders') {
    const rows = listBits(remA), cols = listBits(remB);
    const total = rows.length * cols.length;
    let done = 0;
    const A = rows.map((dA) => cols.map((dB) => {
      const v = engine.objAttackerStage(remA, remB, mod, M, V, dA, dB).eq.v;
      done++;
      if (onProgress) onProgress(done / total);
      return v;
    }));
    const res = analyse(A, rows, cols, (i, j) => engine.metAttacker(remA, remB, mod, M, V, rows[i], cols[j]));
    return { step: 'defenders', accumulated: acc, ...res };
  }

  const { dA, dB } = state;
  if (state.step === 'attackers') {
    const st = engine.objAttackerStage(remA, remB, mod, M, V, dA, dB);
    const res = analyse(st.A, st.rows, st.cols, (i, j) => engine.metChoose(remA, remB, mod, M, V, dA, dB, st.rows[i], st.cols[j]));
    return { step: 'attackers', accumulated: acc, ...res };
  }

  const { pa, pb } = state;
  if (state.step === 'choices') {
    const st = engine.objChooseStage(remA, remB, mod, M, V, dA, dB, pa, pb);
    // rows: k (their attacker our defender plays), cols: l (our attacker their defender plays)
    const res = analyse(st.A, [pb[0], pb[1]], [pa[0], pa[1]], (k, l) => engine.metOutcome(remA, remB, mod, M, V, dA, dB, pa, pb, k, l));
    return { step: 'choices', accumulated: acc, ...res };
  }

  if (state.step === 'layouts') {
    const { k, l } = state;
    const ourGame = { a: dA, b: pb[k] }, theirGame = { a: pa[l], b: dB };
    const theirAssumed = engine.theirDefLayout(theirGame.a, theirGame.b);
    const options = [0, 1, 2].map((layout) => {
      const next = setLayouts(state, layout, theirAssumed);
      const nAcc = accumulated(next, mu, sd);
      const met = next.step === 'done'
        ? engine.terminal(nAcc.M, nAcc.V)
        : engine.metModule(next.remA, next.remB, next.mod, nAcc.M, nAcc.V);
      return { layout, gameMean: mu[layout][ourGame.a][ourGame.b], gameSd: sd[layout][ourGame.a][ourGame.b], metrics: metricsOf(met) };
    });
    let best = 0;
    for (let i = 1; i < 3; i++) if (options[i].metrics.obj > options[best].metrics.obj + 1e-12) best = i;
    return {
      step: 'layouts', accumulated: acc, ourGame, theirGame, theirAssumed, options, best,
      theirOptions: [0, 1, 2].map((layout) => ({ layout, gameMean: mu[layout][theirGame.a][theirGame.b] })),
      projection: options[best].metrics,
    };
  }
  throw new Error(`Unknown step ${state.step}`);
}

function listBits(mask) {
  const out = [];
  for (let i = 0; mask; i++, mask >>= 1) if (mask & 1) out.push(i);
  return out;
}

// ---- src/matrix.js
// Parsing of a matchup matrix pasted from a spreadsheet (Google Sheets / Excel).
//
// Two layouts are recognised:
//  - square grid: our players in rows, their players in columns, optional
//    header row / column with names;
//  - "one row per layout": a header row with a "Layout" column, then for each
//    of our players three rows "Layout A", "Layout B", "Layout C".
// Separators: tab (Google Sheets copy), ';' or ','. Quoted multi-line cells
// (as produced by Google Sheets for cells with line breaks) are supported.
//
// Cell formats: "12", "12,5", "12±3", "12+-3", "12 (3)" -> BP mean [± sd],
// or a code from the team's reference table (e.g. "WIN", "p_LOSE", "GAMBLE").

const CELL = /^\s*([+-]?\d+(?:[.,]\d+)?)\s*(?:(?:±|\+-|\+\/-)\s*(\d+(?:[.,]\d+)?)|\(\s*(\d+(?:[.,]\d+)?)\s*\))?\s*$/;

// Default reference table ("Référentiel des estimés"). Centres come from the
// team's sheet; standard deviations are our reading of its risk notes
// ("faible risque", "variance faible", "forte variance") and are editable.
const DEFAULT_CODES = [
  { code: 'FACILE', mean: 17, sd: 3, label: 'Match très favorable (15–20)' },
  { code: 'WIN', mean: 14, sd: 3, label: 'Match positif (13–15)' },
  { code: 'p_WIN', mean: 12, sd: 3, label: 'Léger avantage (11–13)' },
  { code: 'DRAW', mean: 10, sd: 2.5, label: 'Match équilibré (9–11)' },
  { code: 'p_LOSE', mean: 8, sd: 3, label: 'Léger désavantage (7–9)' },
  { code: 'LOSE', mean: 6, sd: 3, label: 'Match négatif (5–7)' },
  { code: 'ALED', mean: 3, sd: 3, label: 'Match très défavorable (0–5)' },
  { code: 'GAMBLE', mean: 10, sd: 5, label: 'Match très volatil (5–15)' },
];

// Codes meaning "no estimate yet".
const MISSING_CODES = new Set(['SAISPO', 'SAIS-PO', '?', '-', '—']);

function normaliseCode(text) {
  return String(text ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').trim().toUpperCase().replace(/\s+/g, '_');
}

function isMissingCode(text) {
  const c = normaliseCode(text);
  return MISSING_CODES.has(c) || MISSING_CODES.has(c.replace(/-/g, ''));
}

// Code cell with an optional swing scenario and uncertainty:
//   "p_WIN!"      : stable p_WIN, with a chance to punish an opponent's mistake
//                   and reach a big score ("upside")
//   "p_WIN?"      : p_WIN, with a risk of being punished ("downside")
//   "p_WIN!40"    : explicit chance (40 %); "%" is optional
//   "p_WIN!40_20" : explicit chance and score reached (20 BP, i.e. a 20-0)
//   "p_LOSE?50_3" : 50 % risk of ending at 3 BP
//   "WIN±5"       : explicit standard deviation in BP for the base result
const CODE_CELL = /^\s*(.*?)\s*(?:([!?])\s*(\d{1,3}(?:[.,]\d+)?)?\s*%?\s*(?:_\s*(\d{1,2}(?:[.,]\d+)?))?)?\s*(?:(?:±|\+-|\+\/-)\s*(\d+(?:[.,]\d+)?))?\s*$/;

// Defaults for "!" / "?" (editable in the Matrix tab):
//   chance : probability (%) that the swing happens
//   high   : BP reached when we punish
//   low    : BP left when we get punished
//   spread : sd (BP) of the swing result, reduced near 0 and 20 (a 20-0 is exact)
const DEFAULT_SWING = { chance: 25, high: 18, low: 3, spread: 2 };

function swingSpread(target, spread = DEFAULT_SWING.spread) {
  return Math.max(0, Math.min(spread, 20 - target, target));
}

// Mean and sd of a two-outcome game: base N(c, s²) with probability 1 - p,
// swing N(h, sh²) with probability p (moment matching, see docs/MODEL.md).
function swingMoments(c, s, p, h, sh) {
  const mean = (1 - p) * c + p * h;
  const ex2 = (1 - p) * (s * s + c * c) + p * (sh * sh + h * h);
  return { mean, sd: Math.sqrt(Math.max(0, ex2 - mean * mean)) };
}

// Returns { value, sd, code?, swing?, bp? } or null. Code cells are already in BP.
// options.swing: defaults for "!" / "?" (see DEFAULT_SWING).
function parseCell(text, codes = DEFAULT_CODES, options = {}) {
  if (text == null) return null;
  const num = (s) => (s == null ? null : parseFloat(s.replace(',', '.')));
  const m = CELL.exec(String(text));
  if (m) return { value: num(m[1]), sd: num(m[2] ?? m[3]) };
  const find = (t) => codes.find((c) => normaliseCode(c.code) === normaliseCode(t));
  const exact = normaliseCode(text) ? find(text) : null;
  if (exact) return { value: exact.mean, sd: exact.sd, code: exact.code, bp: true };
  const c = CODE_CELL.exec(String(text));
  if (!c || !c[1]) return null;
  const hit = find(c[1]);
  if (!hit) return null;
  const base = { mean: hit.mean, sd: c[5] != null ? num(c[5]) : hit.sd, customSd: c[5] != null };
  if (!c[2]) return { value: base.mean, sd: base.sd, code: hit.code, bp: true };
  const sw = { ...DEFAULT_SWING, ...options.swing };
  const up = c[2] === '!';
  const chance = c[3] != null ? num(c[3]) : sw.chance;
  const target = c[4] != null ? num(c[4]) : up ? sw.high : sw.low;
  if (!(chance >= 0 && chance <= 100) || !(target >= 0 && target <= 20)) return null;
  const { mean, sd } = swingMoments(base.mean, base.sd, chance / 100, target, swingSpread(target, sw.spread));
  return {
    value: Math.max(0, Math.min(20, mean)), sd,
    code: hit.code, bp: true,
    swing: { kind: up ? 'punish' : 'punished', chance, base: base.mean, target },
  };
}

// Inverse of parseCell for code cells: builds "p_WIN", "p_WIN!", "p_WIN!40_20"...
// Chance and score are written only when they differ from the defaults.
function formatCodeCell({ code, kind = null, chance, target, sd = null }, defaults = DEFAULT_SWING) {
  const d = { ...DEFAULT_SWING, ...defaults };
  let out = code;
  if (kind) {
    const defTarget = kind === 'punish' ? d.high : d.low;
    const showTarget = target != null && target !== defTarget;
    const showChance = showTarget || (chance != null && chance !== d.chance);
    out += kind === 'punish' ? '!' : '?';
    if (showChance) out += String(chance ?? d.chance);
    if (showTarget) out += `_${target}`;
  }
  if (sd != null) out += `±${sd}`;
  return out;
}

// RFC-4180-ish parser: handles quoted fields containing separators, quotes and
// line breaks.
function parseDelimited(text, sep) {
  const rows = [];
  let row = [], field = '', i = 0, quoted = false;
  text = text.replace(/\r\n?/g, '\n');
  while (i < text.length) {
    const ch = text[i];
    if (quoted) {
      if (ch === '"') {
        if (text[i + 1] === '"') { field += '"'; i += 2; continue; }
        quoted = false; i++; continue;
      }
      field += ch; i++; continue;
    }
    if (ch === '"' && field === '') { quoted = true; i++; continue; }
    if (ch === sep) { row.push(field); field = ''; i++; continue; }
    if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
    field += ch; i++;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows.map((r) => r.map((c) => c.trim())).filter((r) => r.some((c) => c !== ''));
}

function detectSeparator(text) {
  return text.includes('\t') ? '\t' : text.includes(';') ? ';' : ',';
}

// "Joueur 1\nÀ renseigner" -> "Joueur 1"; "Adversaire 2\nOrks" -> "Orks".
function cleanName(text, fallback) {
  const lines = String(text ?? '').split('\n').map((l) => l.trim()).filter(Boolean);
  const useful = lines.filter((l) => !/^[àa] renseigner$/i.test(l));
  if (!useful.length) return fallback;
  return useful.length > 1 ? useful.slice(1).join(' ') : useful[0];
}

const LAYOUT_ROW = /^layout\s*([abc])$/i;

function parseLayoutRows(grid, codes) {
  const hIdx = grid.findIndex((r) => r.some((c) => /^layout$/i.test(c)));
  const header = hIdx >= 0 ? grid[hIdx] : null;
  let layoutCol = header ? header.findIndex((c) => /^layout$/i.test(c)) : -1;
  if (layoutCol < 0) {
    const first = grid.find((r) => r.some((c) => LAYOUT_ROW.test(c)));
    layoutCol = first.findIndex((c) => LAYOUT_ROW.test(c));
  }
  const nameCol = layoutCol - 1;
  const rows = grid.slice(hIdx + 1).filter((r) => LAYOUT_ROW.test(r[layoutCol] ?? ''));
  const players = [];
  const byPlayer = new Map();
  let lastName = '';
  for (const r of rows) {
    const raw = nameCol >= 0 && r[nameCol] ? r[nameCol] : lastName;
    lastName = raw;
    if (!byPlayer.has(raw)) { byPlayer.set(raw, [null, null, null]); players.push(raw); }
    const l = 'abc'.indexOf(LAYOUT_ROW.exec(r[layoutCol])[1].toLowerCase());
    byPlayer.get(raw)[l] = r.slice(layoutCol + 1);
  }
  const n = players.length;
  const width = Math.max(n, ...rows.map((r) => r.length - layoutCol - 1));
  const nCols = header ? Math.min(width, header.length - layoutCol - 1) : width;
  const colNames = Array.from({ length: nCols }, (_, j) => cleanName(header?.[layoutCol + 1 + j], `Eux ${j + 1}`));
  const rowNames = players.map((p, i) => cleanName(p, `Nous ${i + 1}`));
  const raws = [0, 1, 2].map((l) => players.map((p) => Array.from({ length: nCols }, (_, j) => byPlayer.get(p)[l]?.[j] ?? '')));
  const layouts = raws.map((g) => ({ rowNames, colNames, raw: g, cells: g.map((row) => row.map((c) => parseCell(c, codes))) }));
  return { rowNames, colNames, layouts, raw: raws[0], cells: layouts[0].cells };
}

function parseMatrix(text, codes = DEFAULT_CODES) {
  if (!text.trim()) throw new Error('Matrice vide');
  let grid = parseDelimited(text, detectSeparator(text));
  if (!grid.length) throw new Error('Matrice vide');
  if (grid.some((r) => r.some((c) => LAYOUT_ROW.test(c)))) return parseLayoutRows(grid, codes);

  const isVal = (c) => parseCell(c, codes) !== null || isMissingCode(c);
  const headerRow = grid[0].slice(1).some((c) => c !== '' && !isVal(c));
  let colNames = null;
  if (headerRow) { colNames = grid[0]; grid = grid.slice(1); }
  const headerCol = grid.some((r) => r[0] !== '' && !isVal(r[0]));
  let rowNames = null;
  if (headerCol) {
    rowNames = grid.map((r) => r[0]);
    grid = grid.map((r) => r.slice(1));
    if (colNames) colNames = colNames.slice(1);
  }
  const nCols = Math.max(...grid.map((r) => r.length));
  const raw = grid.map((r) => Array.from({ length: nCols }, (_, j) => r[j] ?? ''));
  return {
    rowNames: (rowNames ?? raw.map((_, i) => `Nous ${i + 1}`)).map((s, i) => cleanName(s, `Nous ${i + 1}`)),
    colNames: (colNames ?? Array.from({ length: nCols }, (_, j) => `Eux ${j + 1}`)).slice(0, nCols).map((s, j) => cleanName(s, `Eux ${j + 1}`)),
    raw,
    cells: raw.map((r) => r.map((c) => parseCell(c, codes))),
  };
}

// Converts a raw value to expected BP (0-20).
//   scale.type === 'bp'     : value already in BP
//   scale.type === 'linear' : [inMin, inMax] -> [outMin, outMax]
function toBp(value, scale) {
  if (value == null) return null;
  let v = value;
  if (scale?.type === 'linear') {
    const { inMin, inMax, outMin, outMax } = scale;
    v = outMin + ((value - inMin) / (inMax - inMin)) * (outMax - outMin);
  }
  return Math.max(0, Math.min(20, v));
}

// sd given in raw units is scaled with the same factor as the value.
function sdToBp(sd, scale) {
  if (sd == null) return null;
  if (scale?.type === 'linear') return Math.abs(sd * (scale.outMax - scale.outMin) / (scale.inMax - scale.inMin));
  return sd;
}

// Builds engine inputs mu[l][a][b], sd[l][a][b] from up to three parsed layout
// matrices (missing layouts fall back to the first one) and a default sd.
// Code cells are already in BP and bypass the numeric scale.
function buildModel(parsedByLayout, n, scale, defaultSd) {
  const base = parsedByLayout.find((p) => p);
  if (!base) throw new Error('Aucune matrice');
  const missing = [];
  const mu = [], sd = [];
  for (let l = 0; l < 3; l++) {
    const p = parsedByLayout[l] ?? base;
    mu.push([]); sd.push([]);
    for (let a = 0; a < n; a++) {
      mu[l].push([]); sd[l].push([]);
      for (let b = 0; b < n; b++) {
        const c = p.cells[a]?.[b] ?? null;
        if (!c) missing.push({ layout: l, a, b });
        mu[l][a].push(c ? (c.bp ? Math.max(0, Math.min(20, c.value)) : toBp(c.value, scale)) : 10);
        sd[l][a].push(c && c.sd != null ? (c.bp ? c.sd : sdToBp(c.sd, scale)) : defaultSd);
      }
    }
  }
  return { mu, sd, missing };
}

// ------------------------------------------------------------ export

// Grid actually used for layout l (the first one when all layouts share it).
function layoutGrid(grids, sameLayouts, l) {
  return sameLayouts ? grids[0] : grids[l];
}

const tsvCell = (v) => {
  const s = String(v ?? '');
  return /[\t\n"]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
};

// "Matrice globale" layout: a header row, then three rows (Layout A/B/C)
// per player. Pasting it back into the tool (or Google Sheets) round-trips.
function toGlobalTsv({ us, them, grids, sameLayouts }) {
  const lines = [['Joueur', 'Layout', ...them].map(tsvCell).join('\t')];
  us.forEach((name, i) => {
    for (let l = 0; l < 3; l++) {
      const row = layoutGrid(grids, sameLayouts, l)[i] ?? [];
      lines.push([name, `Layout ${'ABC'[l]}`, ...them.map((_, j) => row[j] ?? '')].map(tsvCell).join('\t'));
    }
  });
  return lines.join('\n');
}

// Estimates only, same row order as the Matrice globale (player 1 A/B/C,
// player 2 A/B/C...), to paste into the sheet's block of cells.
function toValuesTsv({ us, them, grids, sameLayouts }) {
  const lines = [];
  us.forEach((_, i) => {
    for (let l = 0; l < 3; l++) {
      const row = layoutGrid(grids, sameLayouts, l)[i] ?? [];
      lines.push(them.map((_, j) => tsvCell(row[j] ?? '')).join('\t'));
    }
  });
  return lines.join('\n');
}

// ---- src/shared.js
// Team matrix shared through the Claude artifact `db` capability.
//
// Store layout (at most 1 + 3 * 8 = 25 documents):
//   team/meta          { n, us, them, sameLayouts, codes, swing, updatedAt }
//   rows/L<l>-<i>      { c0, c1, ... }  one document per layout and player
// One field per cell lets two teammates edit different cells of the same
// row at the same time: `update({ c3 })` merges that field only.
//
// The pairing itself (who defends, etc.) stays local to each viewer.

const META_KEYS = ['n', 'us', 'them', 'sameLayouts', 'codes', 'swing'];

const rowId = (l, i) => `L${l}-${i}`;

// Shared part of the local configuration, in store shape.
function toShared(cfg) {
  const n = cfg.n;
  const meta = {
    n,
    us: cfg.us.slice(0, n),
    them: cfg.them.slice(0, n),
    sameLayouts: !!cfg.sameLayouts,
    codes: cfg.codes.map((c) => ({ ...c })),
    swing: { ...cfg.swing },
  };
  const rows = {};
  for (let l = 0; l < 3; l++) {
    for (let i = 0; i < n; i++) {
      const row = cfg.grids[l]?.[i] ?? [];
      rows[rowId(l, i)] = Object.fromEntries(Array.from({ length: n }, (_, j) => [`c${j}`, row[j] ?? '']));
    }
  }
  return { meta, rows };
}

// Store shape -> configuration fields. Missing cells read as ''.
function fromShared(meta, rows) {
  const n = meta.n;
  const grids = [0, 1, 2].map((l) => Array.from({ length: n }, (_, i) => {
    const r = rows[rowId(l, i)] ?? {};
    return Array.from({ length: n }, (_, j) => String(r[`c${j}`] ?? ''));
  }));
  const out = { n, grids, sameLayouts: !!meta.sameLayouts };
  out.us = Array.from({ length: n }, (_, i) => meta.us?.[i] ?? `Nous ${i + 1}`);
  out.them = Array.from({ length: n }, (_, j) => meta.them?.[j] ?? `Eux ${j + 1}`);
  if (Array.isArray(meta.codes)) out.codes = meta.codes.map((c) => ({ ...c }));
  if (meta.swing) out.swing = { ...meta.swing };
  return out;
}

const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);

// What must be written so that the store (base) matches next.
//   meta : changed meta fields, or null
//   rows : [{ id, full }] for documents to create, [{ id, fields }] to merge
function diffShared(base, next) {
  const meta = {};
  for (const k of META_KEYS) if (!same(base?.meta?.[k], next.meta[k])) meta[k] = next.meta[k];
  const rows = [];
  for (const [id, body] of Object.entries(next.rows)) {
    const b = base?.rows?.[id];
    if (!b) { rows.push({ id, full: body }); continue; }
    const fields = {};
    for (const [k, v] of Object.entries(body)) if (b[k] !== v) fields[k] = v;
    if (Object.keys(fields).length) rows.push({ id, fields });
  }
  return { meta: Object.keys(meta).length ? meta : null, rows };
}

// Applies a diff to a store-shaped state (used to keep local, not yet
// written edits on top of a newer remote state).
function patchShared(state, diff) {
  const out = { meta: { ...state.meta, ...(diff.meta ?? {}) }, rows: { ...state.rows } };
  for (const w of diff.rows) out.rows[w.id] = w.full ? { ...w.full } : { ...(out.rows[w.id] ?? {}), ...w.fields };
  return out;
}

// Keeps the local configuration and the store in sync.
//   getLocal()        -> current local configuration
//   applyRemote(part) -> replace the shared fields of the local configuration
//   onStatus(status)  -> 'connecting' | 'empty' | 'live' | 'readonly' | 'error' | 'off'
class SharedMatrix {
  constructor(db, { getLocal, applyRemote, onStatus, debounceMs = 400, now = () => new Date().toISOString() }) {
    this.db = db;
    this.getLocal = getLocal;
    this.applyRemote = applyRemote;
    this.onStatus = onStatus ?? (() => {});
    this.debounceMs = debounceMs;
    this.now = now;
    this.enabled = true;
    this.status = 'connecting';
    this.error = null;
    this.metaKnown = false;
    this.rowsKnown = false;
    this.remoteMeta = null;
    this.remoteRows = {};
    this.base = null; // last store state known to this view, in local shape
    this.existingRows = new Set(); // row documents present in the store
    this.timer = null;
    this.flushing = null;
    this.again = false;
    this.updatedAt = null;
    this.unsub = [];
  }

  start() {
    const fail = (e) => this.setStatus('error', e);
    this.unsub.push(this.db.doc('team/meta').onSnapshot((snap) => {
      this.metaKnown = true;
      this.remoteMeta = snap.exists ? snap.data() : null;
      this.sync();
    }, fail));
    this.unsub.push(this.db.collection('rows').onSnapshot((qs) => {
      this.rowsKnown = true;
      this.remoteRows = Object.fromEntries(qs.docs.map((d) => [d.id, d.data()]));
      this.sync();
    }, fail));
    this.onStatus(this.status);
  }

  stop() {
    for (const u of this.unsub) u();
    this.unsub = [];
    clearTimeout(this.timer);
  }

  setStatus(status, error = null) {
    this.status = status;
    this.error = error;
    this.onStatus(status);
  }

  setEnabled(on) {
    this.enabled = on;
    // Turning sync back on: the team matrix wins over local edits.
    if (on) { this.base = null; this.sync(true); }
    else this.onStatus(this.status);
  }

  // Remote -> local.
  sync(force = false) {
    if (!this.metaKnown || !this.rowsKnown) return;
    if (!this.remoteMeta) {
      this.base = null;
      if (this.status !== 'readonly') this.setStatus('empty');
      return;
    }
    // Normalise the store state to the local shape (missing cells read as ''),
    // so that a cell the store does not have yet never looks like a local edit.
    const remote = toShared({
      codes: [], swing: {},
      ...fromShared(this.remoteMeta, this.remoteRows),
    });
    this.existingRows = new Set(Object.keys(this.remoteRows));
    this.updatedAt = this.remoteMeta.updatedAt ?? null;
    let target = remote;
    // Keep local edits that are not written yet. On the very first remote
    // state the team matrix wins entirely.
    if (this.base && this.enabled && this.status === 'live') {
      const pending = diffShared(this.base, toShared(this.getLocal()));
      target = patchShared(remote, pending);
    }
    this.base = remote;
    if (this.enabled) {
      const local = toShared(this.getLocal());
      if (force || diffShared(local, target).meta || diffShared(local, target).rows.length) {
        this.applyRemote(fromShared(target.meta, target.rows));
      }
    }
    if (this.status !== 'readonly') this.setStatus('live');
    else this.onStatus(this.status);
  }

  // Local -> remote, debounced.
  localChanged() {
    if (!this.enabled || this.status !== 'live') return;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.flush(), this.debounceMs);
  }

  async flush() {
    if (this.flushing) { this.again = true; return this.flushing; }
    this.flushing = (async () => {
      try {
        do {
          this.again = false;
          if (!this.base || !this.enabled || this.status !== 'live') return;
          const diff = diffShared(this.base, toShared(this.getLocal()));
          if (!diff.meta && !diff.rows.length) return;
          const local = toShared(this.getLocal());
          // Rows first, then meta: a larger team size only shows up once its
          // rows exist.
          for (const w of diff.rows) {
            const ref = this.db.collection('rows').doc(w.id);
            if (w.full || !this.existingRows.has(w.id)) {
              await ref.set(local.rows[w.id]);
              this.existingRows.add(w.id);
            } else {
              await ref.update(w.fields);
            }
            this.base.rows[w.id] = { ...local.rows[w.id] };
          }
          const stamp = this.now();
          await this.db.doc('team/meta').update({ ...(diff.meta ?? {}), updatedAt: stamp });
          this.base.meta = { ...this.base.meta, ...(diff.meta ?? {}) };
        } while (this.again);
      } catch (e) {
        if (e?.code === 'invalid_argument') this.setStatus('readonly', e);
        else this.setStatus('error', e);
      } finally {
        this.flushing = null;
      }
    })();
    return this.flushing;
  }

  // Creates (or replaces) the team matrix with the local one.
  async shareMine() {
    const mine = toShared(this.getLocal());
    try {
      await this.db.doc('team/meta').set({ ...mine.meta, updatedAt: this.now() });
      for (const [id, body] of Object.entries(mine.rows)) await this.db.collection('rows').doc(id).set(body);
      this.base = mine;
      this.existingRows = new Set(Object.keys(mine.rows));
      this.enabled = true;
      this.setStatus('live');
    } catch (e) {
      if (e?.code === 'invalid_argument') this.setStatus('readonly', e);
      else this.setStatus('error', e);
    }
  }
}

const STORAGE_KEY = 'w40k-teams-pairing/v1';
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pct = (x) => `${Math.round(x * 100)} %`;
const score = (x) => (x * 100).toFixed(1);
const signed = (x) => (x >= 0 ? '+' : '−') + Math.abs(x * 100).toFixed(1);

const EX_THEM = ['Orks', 'Tyranids', 'Adeptus Custodes', 'Drukhari', 'Grey Knights', 'World Eaters', 'Thousand Sons', 'Imperial Knights'];

function exampleConfig(n = 6) {
  let seed = 17;
  const r = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  const base = Array.from({ length: n }, () => Array.from({ length: n }, () => Math.round(4 + r() * 12)));
  const toCode = (v) => (v >= 15 ? 'FACILE' : v >= 13 ? 'WIN' : v >= 11 ? 'p_WIN' : v >= 9 ? 'DRAW' : v >= 7 ? 'p_LOSE' : v >= 5 ? 'LOSE' : 'ALED');
  const grids = [0, 1, 2].map((l) => base.map((row) => row.map((v) => {
    const x = l === 0 ? v : Math.max(0, Math.min(20, v + Math.round((r() - 0.5) * 6)));
    return r() < 0.06 ? 'GAMBLE' : toCode(x);
  })));
  return {
    version: 1, example: true, n, round: 1,
    us: EX_US.slice(0, n), them: EX_THEM.slice(0, n),
    grids, sameLayouts: false, defaultSd: 4,
    scale: { type: 'bp', inMin: -2, inMax: 2, outMin: 4, outMax: 16 },
    objective: { marginWeight: 0, drawValue: 0.5 },
    precision: 'standard',
    codes: defaultCodes(),
    swing: { ...DEFAULT_SWING },
  };
}

function defaultCodes() {
  return DEFAULT_CODES.map((c) => ({ ...c }));
}

function resize(c, n) {
  const fit = (arr, fill) => Array.from({ length: n }, (_, i) => arr[i] ?? fill(i));
  c.us = fit(c.us, (i) => `Nous ${i + 1}`);
  c.them = fit(c.them, (i) => `Eux ${i + 1}`);
  c.grids = c.grids.map((g) => fit(g, () => []).map((row) => fit(row, () => '10')));
  c.n = n;
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (!data?.cfg?.grids || !MODULES_BY_SIZE[data.cfg.n]) return null;
    return data;
  } catch { return null; }
}

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ cfg, live })); } catch { /* storage unavailable */ }
}

const saved = load();
let cfg = saved?.cfg ?? exampleConfig(6);
if (!Array.isArray(cfg.codes)) cfg.codes = defaultCodes();
cfg.swing = { ...DEFAULT_SWING, ...cfg.swing };
delete cfg.nuanceStep;
let live = saved?.live ?? { history: [], state: initialState(cfg.n, cfg.round) };
if (live.state.n !== cfg.n) live = { history: [], state: initialState(cfg.n, cfg.round) };

let editLayout = 0;

function currentModel() {
  const parsed = [0, 1, 2].map((l) => ({
    cells: (cfg.sameLayouts ? cfg.grids[0] : cfg.grids[l]).map((row) => row.map((v) => parseCell(v, cfg.codes, { swing: cfg.swing }))),
  }));
  return buildModel(parsed, cfg.n, cfg.scale, Number(cfg.defaultSd) || 4);

function engineConfig() {
  const m = currentModel();
  return {
    n: cfg.n, round: cfg.round, mu: m.mu, sd: m.sd,
    objective: { marginWeight: Number(cfg.objective.marginWeight), drawValue: Number(cfg.objective.drawValue) },
    quantum: cfg.precision === 'fast' ? { mean: 1, variance: 8 } : { mean: 0.5, variance: 4 },
    missing: m.missing.length,
  };
}

function resetPairing() {
  live = { history: [], state: initialState(cfg.n, cfg.round) };
  save();
}

// ------------------------------------------------------------- computation

let advice = null, adviceKey = null, adviceError = null, computing = false, progress = 0;
let worker = null, workerKey = null, workerBusy = false, pending = null, useSync = false;
let syncEngine = null, syncKey = null, reqId = 0;

function makeWorker() {
  if (window.__CORE_SOURCE__) {
    const url = URL.createObjectURL(new Blob([window.__CORE_SOURCE__], { type: 'text/javascript' }));
    return new Worker(url);
  }
  return new Worker(new URL('./worker.js', import.meta.url), { type: 'module' });
}

function ensureAdvice() {
  const ec = engineConfig();
  const eKey = JSON.stringify(ec);
  const key = eKey + JSON.stringify(live.state);
  if (key === adviceKey) return;
  adviceKey = key; advice = null; adviceError = null; computing = true; progress = 0;
  compute(eKey, ec, live.state, key);
}

function compute(eKey, ec, state, key) {
  const id = ++reqId;
  pending = { id, key };
  if (!useSync) {
    try {
      if (!worker || workerKey !== eKey || workerBusy) {
        if (worker) worker.terminate();
        worker = makeWorker();
        workerKey = eKey;
        worker.onmessage = (e) => onWorker(e.data);
        worker.onerror = (e) => {
          e.preventDefault?.();
          useSync = true; worker?.terminate(); worker = null; workerBusy = false;
          compute(eKey, ec, state, key);
        };
        worker.postMessage({ type: 'init', config: ec });
      }
      workerBusy = true;
      worker.postMessage({ type: 'advise', id, state });
      return;
    } catch {
      useSync = true;
    }
  }
  setTimeout(() => {
    if (pending?.id !== id) return;
    try {
      if (syncKey !== eKey) { syncEngine = createEngine(ec); syncKey = eKey; }
      finish(key, advise(syncEngine, state, ec.mu, ec.sd), null);
    } catch (err) { finish(key, null, String(err?.message ?? err)); }
  }, 30);
}

function onWorker(msg) {
  if (!pending || msg.id !== pending.id) return;
  if (msg.type === 'progress') {
    progress = msg.p;
    const bar = $('#progress-bar');
    if (bar) bar.style.width = `${Math.round(progress * 100)}%`;
    return;
  }
  workerBusy = false;
  finish(pending.key, msg.type === 'advice' ? msg.advice : null, msg.type === 'error' ? msg.message : null);
}

function finish(key, adv, err) {
  if (key !== adviceKey) return;
  computing = false;
  advice = adv; adviceError = err;
  if (tab === 'pairing') render();
}

// -------------------------------------------------------------- rendering

function render() {
  $$('nav.tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
  const app = $('#app');
  if (tab === 'pairing') { ensureAdvice(); app.innerHTML = pairingView(); bindPairing(); }
  else if (tab === 'matrix') { app.innerHTML = matrixView(); bindMatrix(); }
  else { app.innerHTML = methodView(); }
}

function vdlBar(m) {
  const w = m.win * 100, d = m.draw * 100, l = m.loss * 100;
  const lab = (x, t) => (x >= 12 ? `${t} ${Math.round(x)} %` : x >= 6 ? `${Math.round(x)}` : '');
  return `<div class="vdl" role="img" aria-label="Victoire ${Math.round(w)} %, nul ${Math.round(d)} %, défaite ${Math.round(l)} %">
    <div class="w" style="width:${w}%">${lab(w, 'V')}</div><div class="d" style="width:${d}%">${lab(d, 'N')}</div><div class="l" style="width:${l}%">${lab(l, 'D')}</div></div>`;
}

function miniBar(m) {
  return `<span class="minibar" title="V ${pct(m.win)} · N ${pct(m.draw)} · D ${pct(m.loss)}"><i class="w" style="width:${m.win * 100}%"></i><i class="d" style="width:${m.draw * 100}%"></i><i class="l" style="width:${m.loss * 100}%"></i></span>`;
}

function projectionPanel() {
  const th = thresholds(cfg.n);
  const p = advice?.projection;
  const body = p ? `
    ${vdlBar(p)}
    <div class="bigline"><span class="big num">${score(p.obj)}</span><span class="muted">score objectif (sur 100)</span></div>
    <dl class="kv">
      <dt>Victoire / nul / défaite</dt><dd>${pct(p.win)} / ${pct(p.draw)} / ${pct(p.loss)}</dd>
      <dt>BP attendus</dt><dd>${p.bp.toFixed(1)} – ${(th.total - p.bp).toFixed(1)}</dd>
      <dt>Points d'équipe attendus</dt><dd>${p.tp.toFixed(2)}</dd>
      <dt>Seuil de victoire</dt><dd>≥ ${th.win} BP (écart ${th.differential})</dd>
    </dl>
    <p class="note">Projection si les deux équipes jouent au mieux à partir d'ici.</p>` : `<p class="muted">${computing ? 'Calcul en cours…' : '—'}</p>`;
  return `<section class="panel proj" aria-live="polite"><h3>Projection du match</h3>${body}</section>`;
}

function timeline() {
  const s = live.state;
  const items = [];
  s.modules.forEach((m, i) => {
    if (m === 'C') {
      items.push(`<li class="${s.mod > i || s.step === 'done' ? 'past' : ''}">Champion</li>`);
      return;
    }
    for (const step of ['defenders', 'attackers', 'choices', 'layouts']) {
      const cls = i < s.mod || s.step === 'done' ? 'past' : i === s.mod && s.step === step ? 'now' : '';
      const past = i === s.mod && ['defenders', 'attackers', 'choices', 'layouts'].indexOf(step) < ['defenders', 'attackers', 'choices', 'layouts'].indexOf(s.step);
      items.push(`<li class="${past ? 'past' : cls}">${esc(MODULE_NAMES[m])} · ${STEP_NAMES[step]}</li>`);
    }
  });
  return `<ol class="timeline">${items.join('')}</ol>`;
}

function gamesList() {
  const m = currentModel();
  const s = live.state;
  if (!s.games.length) return '<p class="muted">Aucune partie fixée pour l\'instant.</p>';
  return `<ul class="games">${s.games.map((g) => `
    <li><span>${esc(us(g.a))} <span class="muted">vs</span> ${esc(them(g.b))}</span>
      <span class="num">${m.mu[g.layout][g.a][g.b].toFixed(1)}±${m.sd[g.layout][g.a][g.b].toFixed(0)}</span>
      <span class="role">${ROLE_NAMES[g.role]} · layout ${LAYOUTS[g.layout]}</span><span></span></li>`).join('')}</ul>`;
}

function pairingView() {
  const s = live.state;
  const ec = engineConfig();
  const main = computing
    ? `<section class="panel"><h2>Calcul des recommandations…</h2><div class="progress"><i id="progress-bar" style="width:${Math.round(progress * 100)}%"></i></div>
       <p class="note">${cfg.n === 8 && s.mod === 0 && s.step === 'defenders' ? 'À 8 joueurs, le premier calcul explore tout l\'arbre de pairing (15 à 40 s). Les étapes suivantes seront instantanées.' : 'Quelques instants.'}</p></section>`
    : adviceError ? `<section class="panel"><h2>Erreur de calcul</h2><p class="warn">${esc(adviceError)}</p></section>`
      : stepView();
  return `
  <div class="grid-2">
    <div class="stack">
      <section class="panel">
        <div class="row" style="justify-content:space-between">
          <h2>Ronde ${cfg.round} · ${cfg.n} joueurs</h2>
          <div class="row">
            <button class="btn small" id="undo" ${live.history.length ? '' : 'disabled'}>Annuler la dernière étape</button>
            <button class="btn small" id="restart">Recommencer le pairing</button>
          </div>
        </div>
        ${timeline()}
        ${cfg.example ? '<p class="note">Données d\'exemple. Remplacez-les dans l\'onglet Matrice.</p>' : ''}
        ${shared?.status === 'live' && shared.enabled ? '<p class="note">Matrice d\'équipe synchronisée.</p>' : ''}
        ${ec.missing ? `<p class="warn">${ec.missing} case(s) de matrice à estimer (vides, SAIS-PÔ ou illisibles), comptées comme DRAW (10 BP) en attendant.</p>` : ''}
      </section>
      ${main}
    </div>
    <aside class="stack">
      ${projectionPanel()}
      <section class="panel"><h3>Parties fixées</h3>${gamesList()}</section>
    </aside>
  </div>`;
}

function chips(r, adv, best) {
  if (r.prob > 0.005) return `<span class="chip best">à jouer ${pct(r.prob)}</span>`;
  if (r.vsEq >= best - 0.005) return '<span class="chip eq">équivalent</span>';
  if (r.vsEq < best - 0.03) return '<span class="chip bad">à éviter</span>';
  return '';
}

function optionsTable(adv, rowLabel, colLabel) {
  const best = Math.max(...adv.rows.map((r) => r.vsEq));
  const sorted = [...adv.rows].sort((a, b) => b.vsEq - a.vsEq);
  return `<div class="tablewrap"><table>
    <thead><tr><th>Notre option</th><th></th><th class="num" title="Score si l'adversaire joue sa meilleure stratégie">Score</th><th class="num">Écart</th>
      <th class="num" title="Score si l'adversaire devine notre choix et contre au mieux">Pire cas</th><th>Contré par</th><th class="num">Meilleur cas</th><th>V / N / D</th><th class="num">BP</th></tr></thead>
    <tbody>${sorted.map((r) => `<tr class="${r.prob > 0.005 ? 'picked' : ''}">
      <td>${esc(rowLabel(r.label))}</td><td>${chips(r, adv, best)}</td>
      <td class="num">${score(r.vsEq)}</td><td class="num">${signed(r.vsEq - best)}</td>
      <td class="num">${score(r.worst)}</td><td class="muted">${esc(colLabel(adv.cols[r.worstCol].label))}</td>
      <td class="num">${score(r.best)}</td><td>${miniBar(r.metrics)}</td><td class="num">${r.metrics.bp.toFixed(1)}</td></tr>`).join('')}
    </tbody></table></div>`;
}

function opponentBlock(adv, rowLabel, colLabel) {
  const mix = adv.cols.filter((c) => c.prob > 0.005).sort((a, b) => b.prob - a.prob);
  const opts = adv.cols.map((c, j) => `<option value="${j}">${esc(colLabel(c.label))}</option>`).join('');
  return `<div class="field"><span>Côté adversaire</span>
    <p>Leur meilleure stratégie : ${mix.map((c) => `<strong>${esc(colLabel(c.label))}</strong> (${pct(c.prob)})`).join(', ')}.</p>
    <div class="row"><label class="field"><span>Si vous pensez qu'ils vont jouer</span><select class="inp" id="predict">${opts}</select></label>
    <p id="predict-out" class="note"></p></div></div>`;
}

function heatmap(adv, rowLabel, colLabel) {
  const cell = (v) => {
    const d = v - adv.value;
    const k = Math.min(1, Math.abs(d) / 0.15) * 55;
    const col = d >= 0 ? 'var(--good)' : 'var(--bad)';
    return `<td style="background:color-mix(in srgb, ${col} ${k.toFixed(0)}%, var(--surface))">${score(v)}</td>`;
  };
  return `<details><summary>Matrice complète (score pour chaque combinaison de choix)</summary>
    <div class="tablewrap"><table class="heat"><thead><tr><th></th>${adv.cols.map((c) => `<th class="col">${esc(colLabel(c.label))}</th>`).join('')}</tr></thead>
    <tbody>${adv.A.map((row, i) => `<tr><th>${esc(rowLabel(adv.rows[i].label))}</th>${row.map(cell).join('')}</tr>`).join('')}</tbody></table></div>
    <p class="note">Lignes : nos options. Colonnes : leurs options. Vert : mieux que la valeur d'équilibre (${score(adv.value)}). Rouge : moins bien.</p></details>`;
}

function recommendation(adv, rowLabel, verb) {
  const mix = adv.rows.filter((r) => r.prob > 0.005).sort((a, b) => b.prob - a.prob);
  const best = Math.max(...adv.rows.map((r) => r.vsEq));
  const eqs = adv.rows.filter((r) => r.prob <= 0.005 && r.vsEq >= best - 0.005);
  let txt;
  if (mix.length === 1) {
    txt = `<p>${verb} <strong>${esc(rowLabel(mix[0].label))}</strong>.</p>`;
  } else {
    txt = `<p>${verb} en variant : ${mix.map((r) => `<strong>${esc(rowLabel(r.label))}</strong> ${pct(r.prob)}`).join(', ')}.</p>
      <p class="note">Aucun choix fixe n'est sûr ici : un choix prévisible se fait contrer. Tirez au sort selon ces proportions.</p>
      <div class="row"><button class="btn small" id="draw">Tirer au sort</button><span id="draw-out"></span></div>`;
  }
  if (eqs.length) txt += `<p class="note">Presque aussi bon (moins de 0,5 point d'écart) : ${eqs.map((r) => esc(rowLabel(r.label))).join(', ')}.</p>`;
  return `<div class="reco">${txt}</div>`;
}

function select(id, options, selected) {
  return `<select class="inp" id="${id}">${options.map(([v, t]) => `<option value="${esc(v)}" ${String(v) === String(selected) ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>`;
}

function topIndex(list) {
  let b = 0;
  list.forEach((x, i) => { if (x.prob > list[b].prob) b = i; });
  return b;
}

function stepView() {
  const s = live.state, adv = advice;
  if (!adv) return '';
  const mod = MODULE_NAMES[s.modules[s.mod]] ?? '';
  if (s.step === 'done') {
    return `<section class="panel"><h2>Pairing terminé</h2>
      <p>Toutes les parties sont fixées. Projection finale : ${pct(adv.projection.win)} de victoire, ${pct(adv.projection.draw)} de nul, ${pct(adv.projection.loss)} de défaite, ${adv.projection.bp.toFixed(1)} BP attendus.</p>
      <p class="note">Passez à la ronde suivante dans l'onglet Matrice (le layout des attaquants refusés et des champions change à chaque ronde).</p></section>`;
  }
  if (s.step === 'defenders') {
    const rl = (i) => us(i), cl = (j) => them(j);
    return `<section class="panel"><h2>${mod} · choix du défenseur</h2>
      <p class="note">Chaque équipe choisit secrètement un défenseur, puis les deux sont révélés.</p>
      ${recommendation(adv, rl, 'Défendre avec')}
      ${optionsTable(adv, rl, cl)}
      ${opponentBlock(adv, rl, cl)}
      ${heatmap(adv, rl, cl)}
      <form class="choose" id="apply">
        <label class="field"><span>Notre défenseur</span>${select('in-a', adv.rows.map((r) => [r.label, us(r.label)]), adv.rows[topIndex(adv.rows)].label)}</label>
        <label class="field"><span>Leur défenseur (révélé)</span>${select('in-b', adv.cols.map((c) => [c.label, them(c.label)]), adv.cols[topIndex(adv.cols)].label)}</label>
        <button class="btn primary" type="submit">Valider les défenseurs révélés</button>
      </form></section>`;
  }
  if (s.step === 'attackers') {
    const rl = usPair, cl = themPair;
    return `<section class="panel"><h2>${mod} · choix des attaquants</h2>
      <p class="note">Défenseurs révélés : <strong>${esc(us(s.dA))}</strong> pour nous, <strong>${esc(them(s.dB))}</strong> pour eux. Chaque équipe envoie secrètement deux attaquants contre le défenseur adverse.</p>
      ${recommendation(adv, rl, `Envoyer contre ${esc(them(s.dB))}`)}
      ${optionsTable(adv, rl, cl)}
      ${opponentBlock(adv, rl, cl)}
      ${heatmap(adv, rl, cl)}
      <form class="choose" id="apply">
        <label class="field"><span>Nos attaquants</span>${select('in-a', adv.rows.map((r, i) => [i, usPair(r.label)]), topIndex(adv.rows))}</label>
        <label class="field"><span>Leurs attaquants (révélés)</span>${select('in-b', adv.cols.map((c, j) => [j, themPair(c.label)]), topIndex(adv.cols))}</label>
        <button class="btn primary" type="submit">Valider les attaquants révélés</button>
      </form></section>`;
  }
  if (s.step === 'choices') {
    const rl = (b) => `${us(s.dA)} affronte ${them(b)}`;
    const cl = (a) => `${them(s.dB)} affronte ${us(a)}`;
    return `<section class="panel"><h2>${mod} · attaquant retenu</h2>
      <p class="note">Leurs attaquants contre ${esc(us(s.dA))} : <strong>${esc(themPair(s.pb))}</strong>. Nos attaquants contre ${esc(them(s.dB))} : <strong>${esc(usPair(s.pa))}</strong>.
      ${s.modules[s.mod] === 'M' ? 'Les deux attaquants refusés joueront l\'un contre l\'autre sur le layout ' + LAYOUTS[layoutForRound(cfg.round)] + '.' : 'Les attaquants refusés retournent dans le groupe.'}</p>
      ${recommendation(adv, rl, 'Choisir :')}
      ${optionsTable(adv, rl, cl)}
      ${opponentBlock(adv, rl, cl)}
      <form class="choose" id="apply">
        <label class="field"><span>Notre défenseur affronte</span>${select('in-a', adv.rows.map((r, i) => [i, them(r.label)]), topIndex(adv.rows))}</label>
        <label class="field"><span>Leur défenseur affronte (révélé)</span>${select('in-b', adv.cols.map((c, j) => [j, us(c.label)]), topIndex(adv.cols))}</label>
        <button class="btn primary" type="submit">Valider les choix révélés</button>
      </form></section>`;
  }
  if (s.step === 'layouts') {
    const bestObj = adv.options[adv.best].metrics.obj;
    return `<section class="panel"><h2>${mod} · layouts</h2>
      <p class="note">Chaque défenseur déclare le layout de sa partie. Notre partie : <strong>${esc(us(adv.ourGame.a))}</strong> contre <strong>${esc(them(adv.ourGame.b))}</strong>.</p>
      <div class="reco"><p>Déclarer le <strong>layout ${LAYOUTS[adv.best]}</strong>.</p>
      <p class="note">Calculé en supposant que leur défenseur prend le layout le plus défavorable pour nous (${LAYOUTS[adv.theirAssumed]}).</p></div>
      <div class="tablewrap"><table><thead><tr><th>Layout</th><th class="num">BP de cette partie</th><th class="num">Score du match</th><th class="num">Écart</th><th>V / N / D</th></tr></thead>
      <tbody>${adv.options.map((o) => `<tr class="${o.layout === adv.best ? 'picked' : ''}"><td>${LAYOUTS[o.layout]}</td><td class="num">${o.gameMean.toFixed(1)}±${o.gameSd.toFixed(0)}</td>
        <td class="num">${score(o.metrics.obj)}</td><td class="num">${signed(o.metrics.obj - bestObj)}</td><td>${miniBar(o.metrics)}</td></tr>`).join('')}</tbody></table></div>
      <form class="choose" id="apply">
        <label class="field"><span>Notre layout</span>${select('in-a', [0, 1, 2].map((l) => [l, `Layout ${LAYOUTS[l]}`]), adv.best)}</label>
        <label class="field"><span>Leur layout (${esc(them(adv.theirGame.b))} contre ${esc(us(adv.theirGame.a))})</span>${select('in-b', adv.theirOptions.map((o) => [o.layout, `Layout ${LAYOUTS[o.layout]} (${o.gameMean.toFixed(1)} BP pour nous)`]), adv.theirAssumed)}</label>
        <button class="btn primary" type="submit">Valider les layouts</button>
      </form></section>`;
  }
  return '';
}

function commit(next) {
  live = { history: [...live.history, live.state], state: next };
  save();
  render();
}

function bindPairing() {
  $('#undo')?.addEventListener('click', () => {
    if (!live.history.length) return;
    live = { history: live.history.slice(0, -1), state: live.history[live.history.length - 1] };
    save(); render();
  });
  $('#restart')?.addEventListener('click', () => { resetPairing(); render(); });
  const adv = advice, s = live.state;
  if (!adv || s.step === 'done') return;

  $('#draw')?.addEventListener('click', () => {
    let r = Math.random(), pick = adv.rows[adv.rows.length - 1];
    for (const row of adv.rows) { r -= row.prob; if (r <= 0) { pick = row; break; } }
    const idx = adv.rows.indexOf(pick);
    const sel = $('#in-a');
    sel.value = s.step === 'defenders' ? String(pick.label) : String(idx);
    const label = s.step === 'defenders' ? us(pick.label) : s.step === 'attackers' ? usPair(pick.label) : them(pick.label);
    $('#draw-out').innerHTML = `Tirage : <strong>${esc(label)}</strong>`;
  });

  const predict = $('#predict');
  if (predict) {
    const rowLabel = s.step === 'defenders' ? us : s.step === 'attackers' ? usPair : (b) => `${us(s.dA)} affronte ${them(b)}`;
    const show = () => {
      const c = adv.cols[Number(predict.value)];
      const r = adv.rows[c.bestResponse];
      $('#predict-out').innerHTML = `Meilleure réponse : <strong>${esc(rowLabel(r.label))}</strong> (score ${score(c.bestResponseValue)}, contre ${score(adv.value)} à l'équilibre).`;
    };
    predict.value = String(topIndex(adv.cols));
    predict.addEventListener('change', show);
    show();
  }

  $('#apply')?.addEventListener('submit', (e) => {
    e.preventDefault();
    const a = Number($('#in-a').value), b = Number($('#in-b').value);
    try {
      if (s.step === 'defenders') commit(setDefenders(s, a, b));
      else if (s.step === 'attackers') commit(setAttackers(s, adv.rows[a].label, adv.cols[b].label));
      else if (s.step === 'choices') commit(setChoices(s, a, b));
      else if (s.step === 'layouts') commit(setLayouts(s, a, b));
    } catch (err) {
      alertInline(String(err.message ?? err));
    }
  });
}

function alertInline(msg) {
  const f = $('#apply');
  if (!f) return;
  let p = $('.warn', f);
  if (!p) { p = document.createElement('p'); p.className = 'warn'; f.appendChild(p); }
  p.textContent = msg;
}

// ----------------------------------------------------------- matrix view

function cellColor(raw) {
  const c = parseCell(raw, cfg.codes, { swing: cfg.swing });
  if (!c) {
    if (!raw || !String(raw).trim() || isMissingCode(raw)) return 'var(--surface-2)';
    return 'color-mix(in srgb, var(--bad) 30%, var(--surface))';
  }
  if (c.code === 'GAMBLE' || (c.sd ?? 0) >= 5) return 'color-mix(in srgb, #8a63c9 35%, var(--surface))';
  const bp = c.bp ? c.value : toBp(c.value, cfg.scale);
  const d = (bp - 10) / 10;
  const k = Math.min(1, Math.abs(d)) * 50;
  return `color-mix(in srgb, ${d >= 0 ? 'var(--good)' : 'var(--bad)'} ${k.toFixed(0)}%, var(--surface))`;
}

function cellTitle(raw) {
  const c = parseCell(raw, cfg.codes, { swing: cfg.swing });
  if (!c) return raw && String(raw).trim() && !isMissingCode(raw) ? 'Case illisible' : 'Estimation manquante';
  const bp = c.bp ? c.value : toBp(c.value, cfg.scale);
  const sd = c.sd ?? Number(cfg.defaultSd);
  const fr = (x) => Number(x).toFixed(1).replace('.', ',');
  const base = `≈ ${fr(bp)} BP ± ${fr(sd)}`;
  if (!c.swing) return base;
  const what = c.swing.kind === 'punish'
    ? `${c.swing.chance} % de chances de punir (≈ ${c.swing.target} BP)`
    : `${c.swing.chance} % de risque de se faire punir (≈ ${c.swing.target} BP)`;
  return `${c.code} stable (${c.swing.base} BP), ${what} : ${base}`;
}

function cellEditor() {
  if (!selCell) return '<p class="note">Cliquez sur une case de la matrice pour la modifier avec des boutons.</p>';
  const { i, j } = selCell;
  const l = cfg.sameLayouts ? 0 : editLayout;
  const raw = cfg.grids[l][i][j];
  const c = parseCell(raw, cfg.codes, { swing: cfg.swing });
  const code = c?.code ?? null;
  const kind = c?.swing?.kind ?? null;
  const chance = c?.swing?.chance ?? cfg.swing.chance;
  const target = c?.swing?.target ?? (kind === 'punished' ? cfg.swing.low : cfg.swing.high);
  const missing = !c && (!raw || isMissingCode(raw));
  return `
    <div class="row" style="justify-content:space-between">
      <h3>${esc(us(i))} contre ${esc(them(j))}${cfg.sameLayouts ? '' : ` · layout ${LAYOUTS[l]}`}</h3>
      <span class="note">${esc(cellTitle(raw))}</span>
    </div>
    <div class="code-buttons">${cfg.codes.map((k) => `<button type="button" class="codebtn" data-set-code="${esc(k.code)}" aria-pressed="${k.code === code}" style="background:${cellColor(k.code)}" title="${esc(k.label ?? '')}">${esc(k.code)}</button>`).join('')}<button type="button" class="codebtn" data-set-code="SAIS-PÔ" aria-pressed="${missing}">SAIS-PÔ</button></div>
    ${code ? `<div class="row">
      <div class="seg" role="group" aria-label="Scénario">${[['', 'Stable'], ['punish', 'Peut punir (!)'], ['punished', 'Peut se faire punir (?)']].map(([k, t]) => `<button type="button" data-set-kind="${k}" aria-pressed="${(kind ?? '') === k}">${t}</button>`).join('')}</div>
      ${kind ? `<label class="field"><span>Chance (%)</span><input id="ce-chance" type="number" min="0" max="100" step="5" value="${chance}" style="width:80px"></label>
      <label class="field"><span>${kind === 'punish' ? 'Score visé (BP)' : 'Score restant (BP)'}</span><input id="ce-target" type="number" min="0" max="20" step="1" value="${target}" style="width:80px"></label>` : ''}
    </div>` : ''}
    ${cfg.sameLayouts ? '' : `<label class="row" style="gap:6px"><input type="checkbox" id="ce-all" ${ceAll ? 'checked' : ''}> Appliquer aux 3 layouts</label>`}`;
}

function refreshCellEditor() {
  const box = $('#cell-editor');
  if (!box) return;
  box.innerHTML = cellEditor();
  bindCellEditor();
}

function writeSelectedCell(text) {
  const { i, j } = selCell;
  const l = cfg.sameLayouts ? 0 : editLayout;
  const layouts = ceAll && !cfg.sameLayouts ? [0, 1, 2] : [l];
  for (const x of layouts) cfg.grids[x][i][j] = text;
  const inp = $(`input[data-cell="${i},${j}"]`);
  if (inp) {
    inp.value = text;
    inp.parentElement.style.background = cellColor(text);
    inp.parentElement.title = cellTitle(text);
  }
  changed();
  refreshCellEditor();
}

function bindCellEditor() {
  if (!selCell) return;
  const { i, j } = selCell;
  const current = () => {
    const raw = cfg.grids[cfg.sameLayouts ? 0 : editLayout][i][j];
    const c = parseCell(raw, cfg.codes, { swing: cfg.swing });
    const sdm = /(?:±|\+-|\+\/-)\s*(\d+(?:[.,]\d+)?)\s*$/.exec(String(raw ?? ''));
    return {
      code: c?.code ?? null,
      kind: c?.swing?.kind ?? null,
      chance: c?.swing?.chance ?? cfg.swing.chance,
      target: c?.swing?.target ?? null,
      sd: c?.code && sdm ? Number(sdm[1].replace(',', '.')) : null,
    };
  };
  const write = (st) => writeSelectedCell(formatCodeCell(st, cfg.swing));
  $$('[data-set-code]').forEach((b) => b.addEventListener('click', () => {
    if (b.dataset.setCode === 'SAIS-PÔ') { writeSelectedCell('SAIS-PÔ'); return; }
    write({ ...current(), code: b.dataset.setCode });
  }));
  $$('[data-set-kind]').forEach((b) => b.addEventListener('click', () => {
    const st = current();
    const kind = b.dataset.setKind || null;
    const target = kind === st.kind ? st.target : kind === 'punished' ? cfg.swing.low : cfg.swing.high;
    write({ ...st, kind, target });
  }));
  $('#ce-chance')?.addEventListener('change', (e) => {
    const v = Math.max(0, Math.min(100, Math.round(Number(e.target.value))));
    write({ ...current(), chance: Number.isFinite(v) ? v : cfg.swing.chance });
  });
  $('#ce-target')?.addEventListener('change', (e) => {
    const v = Math.max(0, Math.min(20, Number(e.target.value)));
    write({ ...current(), target: Number.isFinite(v) ? v : null });
  });
  $('#ce-all')?.addEventListener('change', (e) => { ceAll = e.target.checked; });
}

          ${cfg.sameLayouts ? '' : `<div class="layout-tabs" role="tablist">${[0, 1, 2].map((x) => `<button role="tab" data-layout="${x}" aria-selected="${x === editLayout}">Layout ${LAYOUTS[x]}</button>`).join('')}</div>`}

      <datalist id="codes-list">${cfg.codes.map((c) => `<option value="${esc(c.code)}">${esc(c.label ?? '')}</option>`).join('')}<option value="SAIS-PÔ">Estimation manquante</option></datalist>
      <div class="tablewrap"><table class="editor"><thead><tr><th></th>${cfg.them.map((t, j) => `<th><input class="name" data-them="${j}" value="${esc(t)}" aria-label="Adversaire ${j + 1}"></th>`).join('')}</tr></thead>
      <tbody>${g.map((row, i) => `<tr><th><input class="name" data-us="${i}" value="${esc(cfg.us[i])}" aria-label="Joueur ${i + 1}"></th>${row.map((v, j) => `<td class="${selCell && selCell.i === i && selCell.j === j ? 'sel' : ''}" style="background:${cellColor(v)}" title="${esc(cellTitle(v))}"><input data-cell="${i},${j}" list="codes-list" value="${esc(v)}" aria-label="${esc(cfg.us[i])} contre ${esc(cfg.them[j])}"></td>`).join('')}</tr>`).join('')}</tbody></table></div>

      <div class="tablewrap"><table class="codes"><thead><tr><th>Code</th><th>Lecture</th><th class="num">Centre (BP)</th><th class="num">Écart-type</th></tr></thead>

      <h3>Punir / se faire punir</h3>
      <div class="row">
